spring:
  application:
    name: cqrs-query-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: mongodb://localhost:27018/products_query
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cqrs-query-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Used only to publish failed records to the dead-letter topic.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173
  kafka:
    topics:
      product-events: catalog.product.events
      product-events-dlt: catalog.product.events.DLT
